<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Welcome back, Girl!</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        font-family: "Courier New", Courier, monospace;
      }
      .login-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-size: 1.3rem;
        width: 100vh;
        height: 100vh;
        margin: auto;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      button {
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="emoji">🦸‍♀️</div>
      <h2>Login to Save the World</h2>
      <form method="POST" action="/login">
        <input
          type="text"
          name="username"
          placeholder="Your superheros name"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Secret password"
          required
        />
        <button type="submit">🦸‍♀️ Fly In</button>
      </form>
      <div class="note">Note: Capes are optional but recommended</div>
    </div>
  </body>
</html>
